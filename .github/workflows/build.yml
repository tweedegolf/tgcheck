name: Create and push a Docker image

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: $GITHUB_SHA

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust_arch: aarch64-unknown-linux-gnu
            docker_arch: arm64
          - rust_arch: x86_64-unknown-linux-gnu
            docker_arch: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          cross build --release --target ${{ matrix.rust_arch }}
          mkdir -p bin
          mv target/${{ matrix.rust_arch }}/release/tgcheck bin/tgcheck.${{ matrix.docker_arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcheck-${{ matrix.docker_arch }}
          path: bin/tgcheck.${{ matrix.docker_arch }}
          if-no-files-found: error

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create version tag
        id: version
        run: echo "tag=$(git show -s --format="%ct-%h" $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin

      - run: ls -a -R bin/

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          pull: true
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: VERSION=${{ steps.version.outputs.tag }}
